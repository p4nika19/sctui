<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SCTUI DRM Satellite Player</title>
  <script src="hls.min.js"></script>
</head>
<body style="background: black; margin: 0; overflow: hidden;">
  <audio id="audio-elem" preload="auto"></audio>
  <script>
    const audio = document.getElementById('audio-elem');
    let currentTrackId = 0;
    let hls = null;

    function cleanupHls() {
      if (hls) {
        try {
          hls.destroy();
        } catch (e) {}
        hls = null;
      }
    }

    if (window.sctuiBridge) {
      window.sctuiBridge.onCommand('cmd-play', (payload) => {
        try {
          cleanupHls();
          currentTrackId = payload.track_id || 0;

          let streamUrl = payload.stream_url || '';
          let licenseToken = payload.license_token || '';

          if (streamUrl.includes('#license_token=')) {
            const parts = streamUrl.split('#license_token=');
            streamUrl = parts[0];
            if (!licenseToken && parts[1]) {
              licenseToken = decodeURIComponent(parts[1]);
            }
          }

          if (!streamUrl) {
            window.sctuiBridge.sendEvent({ type: 'error', message: 'No stream_url provided' });
            return;
          }

          const isHls = streamUrl.includes('.m3u8') || streamUrl.includes('/hls') || streamUrl.includes('/cbcs') || streamUrl.includes('/cenc');

          if (isHls && window.Hls && window.Hls.isSupported()) {
            const hlsConfig = {
              enableWorker: true,
              emeEnabled: true,
              widevineLicenseUrl: 'https://license.media-streaming.soundcloud.cloud/playback/widevine',
              drmSystems: {
                'com.widevine.alpha': {
                  licenseUrl: 'https://license.media-streaming.soundcloud.cloud/playback/widevine',
                  headers: licenseToken ? { 'Authorization': 'Bearer ' + licenseToken } : {}
                }
              },
              licenseXhrSetup: function(xhr, url, keySystem) {
                if (licenseToken) {
                  xhr.setRequestHeader('Authorization', 'Bearer ' + licenseToken);
                }
              }
            };

            hls = new window.Hls(hlsConfig);
            hls.loadSource(streamUrl);
            hls.attachMedia(audio);

            hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
              const playPromise = audio.play();
              if (playPromise !== undefined) {
                playPromise.catch((err) => {
                  window.sctuiBridge.sendEvent({
                    type: 'error',
                    message: err ? err.message : 'Audio play() rejected'
                  });
                });
              }
            });

            hls.on(window.Hls.Events.ERROR, (event, data) => {
              if (data && data.fatal) {
                window.sctuiBridge.sendEvent({
                  type: 'error',
                  message: 'HLS fatal error: ' + data.type + ' (' + data.details + ')'
                });
                switch (data.type) {
                  case window.Hls.ErrorTypes.NETWORK_ERROR:
                    hls.startLoad();
                    break;
                  case window.Hls.ErrorTypes.MEDIA_ERROR:
                    hls.recoverMediaError();
                    break;
                  default:
                    cleanupHls();
                    break;
                }
              }
            });
          } else {
            // Direct playback for progressive / raw streams
            audio.src = streamUrl;
            audio.currentTime = 0;
            const playPromise = audio.play();
            if (playPromise !== undefined) {
              playPromise.catch((err) => {
                window.sctuiBridge.sendEvent({
                  type: 'error',
                  message: err ? err.message : 'Audio play() rejected'
                });
              });
            }
          }
        } catch (e) {
          window.sctuiBridge.sendEvent({ type: 'error', message: e.message });
        }
      });

      window.sctuiBridge.onCommand('cmd-pause', () => {
        try { audio.pause(); } catch (e) {}
      });

      window.sctuiBridge.onCommand('cmd-resume', () => {
        try { audio.play(); } catch (e) {}
      });

      window.sctuiBridge.onCommand('cmd-seek', (posMs) => {
        try {
          if (!isNaN(posMs)) {
            audio.currentTime = Math.max(0, posMs / 1000);
          }
        } catch (e) {}
      });

      window.sctuiBridge.onCommand('cmd-volume', (vol) => {
        try {
          if (!isNaN(vol)) {
            audio.volume = Math.max(0.0, Math.min(1.0, vol));
          }
        } catch (e) {}
      });

      window.sctuiBridge.onCommand('cmd-stop', () => {
        try {
          cleanupHls();
          audio.pause();
          audio.src = '';
          window.sctuiBridge.sendEvent({
            type: 'state',
            playback_state: 'stopped',
            position_ms: 0,
            duration_ms: 0
          });
        } catch (e) {}
      });
    }

    // Audio element event listeners
    let lastTimeUpdateMs = 0;
    audio.addEventListener('timeupdate', () => {
      const now = Date.now();
      if (now - lastTimeUpdateMs >= 250) {
        lastTimeUpdateMs = now;
        window.sctuiBridge.sendEvent({
          type: 'timeupdate',
          position_ms: Math.round(audio.currentTime * 1000),
          duration_ms: Math.round((audio.duration || 0) * 1000)
        });
      }
    });

    audio.addEventListener('playing', () => {
      window.sctuiBridge.sendEvent({
        type: 'state',
        playback_state: 'playing',
        position_ms: Math.round(audio.currentTime * 1000),
        duration_ms: Math.round((audio.duration || 0) * 1000)
      });
    });

    audio.addEventListener('pause', () => {
      if (!audio.ended) {
        window.sctuiBridge.sendEvent({
          type: 'state',
          playback_state: 'paused',
          position_ms: Math.round(audio.currentTime * 1000),
          duration_ms: Math.round((audio.duration || 0) * 1000)
        });
      }
    });

    audio.addEventListener('waiting', () => {
      window.sctuiBridge.sendEvent({
        type: 'state',
        playback_state: 'buffering',
        position_ms: Math.round(audio.currentTime * 1000),
        duration_ms: Math.round((audio.duration || 0) * 1000)
      });
    });

    audio.addEventListener('ended', () => {
      window.sctuiBridge.sendEvent({
        type: 'finished',
        track_id: currentTrackId
      });
    });

    audio.addEventListener('error', () => {
      const msg = audio.error ? (audio.error.message || ('Media error code ' + audio.error.code)) : 'Unknown audio error';
      window.sctuiBridge.sendEvent({
        type: 'error',
        message: msg
      });
    });
  </script>
</body>
</html>
