<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SCTUI DRM Satellite Player</title>
  <script src="/hls.min.js"></script>
</head>
<body style="background: black; margin: 0; overflow: hidden;">
  <audio id="audio-elem" preload="auto"></audio>
  <script>
    const audio = document.getElementById('audio-elem');
    let currentTrackId = 0;
    let currentVolume = 0.2176;
    let hls = null;
    let audioCtx = null;
    let analyser = null;
    let source = null;
    let spectrumTimer = null;

    function ensureAudioContext() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64; // 32 frequency bins
        analyser.smoothingTimeConstant = 0.6;
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (e) {
        console.error('[WebAudio init error]', e);
      }
    }

    function startSpectrum() {
      if (spectrumTimer) return;
      ensureAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      const data = new Uint8Array(analyser ? analyser.frequencyBinCount : 32);
      spectrumTimer = setInterval(() => {
        if (!analyser || audio.paused || audio.ended) {
          stopSpectrum();
          return;
        }
        analyser.getByteFrequencyData(data);
        const bands = new Array(16);
        for (let i = 0; i < 16; ++i) {
          const v = Math.max(data[i * 2], data[i * 2 + 1]) / 255.0;
          bands[i] = Math.round(v * 1000) / 1000;
        }
        window.sctuiBridge.sendEvent({
          type: 'spectrum',
          bands: bands
        });
      }, 35); // ~28 FPS in sync with SCTUI visualizer render loop
    }

    function stopSpectrum() {
      if (spectrumTimer) {
        clearInterval(spectrumTimer);
        spectrumTimer = null;
      }
    }

    function cleanupHls() {
      stopSpectrum();
      if (hls) {
        try {
          hls.destroy();
        } catch (e) {}
        hls = null;
      }
    }

    if (window.sctuiBridge) {
      window.sctuiBridge.onCommand('cmd-play', (payload) => {
        try {
          cleanupHls();
          currentTrackId = payload.track_id || 0;
          if (typeof payload.volume === 'number' && !isNaN(payload.volume)) {
            currentVolume = Math.max(0.0, Math.min(1.0, payload.volume));
          }
          audio.volume = currentVolume;

          let streamUrl = payload.stream_url || '';
          let licenseToken = payload.license_token || '';

          if (streamUrl.includes('#license_token=')) {
            const parts = streamUrl.split('#license_token=');
            streamUrl = parts[0];
            if (!licenseToken && parts[1]) {
              licenseToken = decodeURIComponent(parts[1]);
            }
          }

          if (!streamUrl) {
            window.sctuiBridge.sendEvent({ type: 'error', message: 'No stream_url provided' });
            return;
          }

          const isHls = streamUrl.includes('.m3u8') || streamUrl.includes('/hls') ||
                        streamUrl.includes('/cenc') || streamUrl.includes('/cbcs') ||
                        streamUrl.includes('media-streaming.soundcloud.cloud');

          const baseLicenseUrl = 'https://license.media-streaming.soundcloud.cloud/playback/widevine';
          const fullLicenseUrl = licenseToken
            ? (baseLicenseUrl + '?license_token=' + encodeURIComponent(licenseToken))
            : baseLicenseUrl;

          if (isHls && window.Hls && window.Hls.isSupported()) {
            const hlsConfig = {
              enableWorker: false,
              emeEnabled: true,
              widevineLicenseUrl: fullLicenseUrl,
              drmSystems: {
                'com.widevine.alpha': {
                  licenseUrl: fullLicenseUrl
                }
              },
              licenseXhrSetup: function(xhr, url, keySystem, data) {
                try {
                  const u = new URL(url);
                  if (licenseToken && !u.searchParams.has('license_token')) {
                    u.searchParams.set('license_token', licenseToken);
                  }
                  xhr.open('POST', u.toString(), true);
                  xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                } catch (e) {
                  console.error('[licenseXhrSetup error]', e);
                }
                return data;
              }
            };

            hls = new window.Hls(hlsConfig);
            hls.loadSource(streamUrl);
            hls.attachMedia(audio);

            const isBenignPlayAbort = (err) => {
              if (!err) return false;
              if (err.name === 'AbortError') return true;
              const msg = String(err.message || err);
              return msg.includes('interrupted by a new load request') || msg.includes('interrupted by a call to pause');
            };

            hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
              ensureAudioContext();
              audio.volume = currentVolume;
              const playPromise = audio.play();
              if (playPromise !== undefined) {
                playPromise.catch((err) => {
                  if (isBenignPlayAbort(err)) return;
                  window.sctuiBridge.sendEvent({
                    type: 'error',
                    message: err ? err.message : 'Audio play() rejected'
                  });
                });
              }
            });

            hls.on(window.Hls.Events.ERROR, (event, data) => {
              if (data && data.fatal) {
                if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
                  hls.recoverMediaError();
                } else if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) {
                  hls.startLoad();
                } else {
                  window.sctuiBridge.sendEvent({
                    type: 'error',
                    message: 'HLS fatal error: ' + (data.details || 'unknown')
                  });
                  cleanupHls();
                }
              }
            });
          } else {
            // Direct playback for progressive streams
            ensureAudioContext();
            audio.volume = currentVolume;
            audio.src = streamUrl;
            audio.currentTime = 0;
            const playPromise = audio.play();
            if (playPromise !== undefined) {
              playPromise.catch((err) => {
                if (isBenignPlayAbort(err)) return;
                window.sctuiBridge.sendEvent({
                  type: 'error',
                  message: err ? err.message : 'Audio play() rejected'
                });
              });
            }
          }
        } catch (e) {
          window.sctuiBridge.sendEvent({ type: 'error', message: e.message });
        }
      });

      window.sctuiBridge.onCommand('cmd-pause', () => {
        stopSpectrum();
        try { audio.pause(); } catch (e) {}
      });

      window.sctuiBridge.onCommand('cmd-resume', () => {
        try {
          audio.play();
          startSpectrum();
        } catch (e) {}
      });

      window.sctuiBridge.onCommand('cmd-seek', (posMs) => {
        try {
          if (!isNaN(posMs)) {
            const targetSec = Math.max(0, posMs / 1000);
            const savedVol = currentVolume;
            audio.volume = 0;
            audio.currentTime = targetSec;
            setTimeout(() => {
              try { audio.volume = savedVol; } catch (e) {}
            }, 30);
          }
        } catch (e) {}
      });

      window.sctuiBridge.onCommand('cmd-volume', (vol) => {
        try {
          if (!isNaN(vol)) {
            currentVolume = Math.max(0.0, Math.min(1.0, vol));
            audio.volume = currentVolume;
          }
        } catch (e) {}
      });

      window.sctuiBridge.onCommand('cmd-stop', () => {
        try {
          cleanupHls();
          audio.pause();
          audio.removeAttribute('src');
          audio.load();
          window.sctuiBridge.sendEvent({
            type: 'state',
            playback_state: 'stopped',
            position_ms: 0,
            duration_ms: 0
          });
        } catch (e) {}
      });
    }

    // Audio element event listeners
    let lastTimeUpdateMs = 0;
    audio.addEventListener('timeupdate', () => {
      const now = Date.now();
      if (now - lastTimeUpdateMs >= 250) {
        lastTimeUpdateMs = now;
        window.sctuiBridge.sendEvent({
          type: 'timeupdate',
          position_ms: Math.round(audio.currentTime * 1000),
          duration_ms: Math.round((audio.duration || 0) * 1000)
        });
      }
    });

    audio.addEventListener('playing', () => {
      audio.volume = currentVolume;
      startSpectrum();
      window.sctuiBridge.sendEvent({
        type: 'state',
        playback_state: 'playing',
        position_ms: Math.round(audio.currentTime * 1000),
        duration_ms: Math.round((audio.duration || 0) * 1000)
      });
    });

    audio.addEventListener('pause', () => {
      stopSpectrum();
      if (!audio.ended) {
        window.sctuiBridge.sendEvent({
          type: 'state',
          playback_state: 'paused',
          position_ms: Math.round(audio.currentTime * 1000),
          duration_ms: Math.round((audio.duration || 0) * 1000)
        });
      }
    });

    audio.addEventListener('waiting', () => {
      window.sctuiBridge.sendEvent({
        type: 'state',
        playback_state: 'buffering',
        position_ms: Math.round(audio.currentTime * 1000),
        duration_ms: Math.round((audio.duration || 0) * 1000)
      });
    });

    audio.addEventListener('ended', () => {
      stopSpectrum();
      window.sctuiBridge.sendEvent({
        type: 'finished',
        track_id: currentTrackId
      });
    });

    audio.addEventListener('error', () => {
      stopSpectrum();
      if (!audio.src || audio.src === window.location.href || audio.src === '') {
        return;
      }
      const msg = audio.error ? (audio.error.message || ('Media error code ' + audio.error.code)) : 'Unknown audio error';
      window.sctuiBridge.sendEvent({
        type: 'error',
        message: msg
      });
    });
  </script>
</body>
</html>
